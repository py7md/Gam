  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Cairo','Tajawal','ui-sans-serif','system-ui']}}}};</script>

  <style>
    :root{color-scheme:light}.dark{color-scheme:dark}body{font-family:Cairo,Tajawal,sans-serif}.soft-shadow{box-shadow:0 18px 50px rgba(15,118,110,.1)}.dark .soft-shadow{box-shadow:0 18px 50px rgba(0,0,0,.25)}
    .field{width:100%;border-radius:.9rem;border:1px solid #cbd5e1;background:#fff;padding:.75rem 1rem;outline:none;transition:.2s}.dark .field{border-color:#334155;background:#0f172a;color:#e2e8f0}.field:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.13)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:.85rem;padding:.7rem 1rem;font-weight:700;transition:.2s;cursor:pointer}.btn:hover{transform:translateY(-1px)}.btn-primary{background:#0f766e;color:#fff}.btn-primary:hover{background:#115e59}.btn-secondary{background:#e2e8f0;color:#334155}.dark .btn-secondary{background:#1e293b;color:#e2e8f0}.btn-danger{background:#fee2e2;color:#b91c1c}.dark .btn-danger{background:#450a0a;color:#fecaca}.btn-ghost{color:#475569}.dark .btn-ghost{color:#cbd5e1}.btn-ghost:hover{background:#f1f5f9}.dark .btn-ghost:hover{background:#1e293b}
    .tab{border-bottom:2px solid transparent;color:#64748b}.tab.active{color:#0f766e;border-color:#0f766e;font-weight:800}.dark .tab{color:#94a3b8}.dark .tab.active{color:#5eead4;border-color:#5eead4}.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:1rem}.dark .table-wrap{border-color:#334155}th{background:#f8fafc;color:#475569;font-size:.8rem;white-space:nowrap}.dark th{background:#1e293b;color:#cbd5e1}td{white-space:nowrap}.paid-cell{background:#dcfce7!important;color:#166534}.dark .paid-cell{background:#14532d!important;color:#bbf7d0}.recipient-row{background:#ecfdf5!important}.dark .recipient-row{background:#052e26!important}.modal-bg{background:rgba(15,23,42,.58)}.toast{animation:toastIn .25s ease-out}@keyframes toastIn{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}@media print{.no-print{display:none!important}body{background:#fff!important}}
  </style>

<body class="min-h-screen bg-slate-50 text-slate-800 transition-colors dark:bg-slate-950 dark:text-slate-100">
  <div id="toastRoot" class="fixed bottom-5 right-5 z-[100] space-y-2"></div><div class="min-h-screen flex flex-col">
    <header class="no-print sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90"><div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6"><button id="brandBtn" class="flex items-center gap-3 text-right" type="button"><span class="grid h-11 w-11 place-items-center rounded-2xl bg-teal-700 text-xl text-white shadow-lg">د</span><span><strong class="block text-lg leading-5">جمعيتي</strong><small class="text-xs text-slate-500 dark:text-slate-400">إدارة الجمعيات المالية</small></span></button><div class="flex items-center gap-2"><button id="themeToggle" class="btn btn-secondary" type="button"><span id="themeIcon">☾</span><span class="hidden sm:inline">المظهر</span></button><button id="backHomeBtn" class="btn btn-ghost hidden" type="button">⌂ الرئيسية</button></div></div></header>
    <main id="app" class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6"></main>
    <footer class="no-print mt-10 border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"><div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 px-4 py-5 text-center text-sm text-slate-500 sm:flex-row sm:px-6 sm:text-right"><span>تمت البرمجة والتطوير بواسطة: <strong class="text-teal-700 dark:text-teal-400">أحمد المنتصر</strong></span><div class="flex flex-wrap items-center justify-center gap-2"><a class="btn btn-secondary !py-2 !text-xs" href="tel:773086403">☎ 773086403</a><a class="btn !bg-green-600 !py-2 !text-xs !text-white" href="https://wa.me/967773086403" target="_blank" rel="noopener">واتساب</a></div></div></footer>
  </div><div id="modalRoot"></div>
  <script>
  'use strict';
  const STORAGE_KEY='jamiyati_associations_v1',THEME_KEY='jamiyati_theme';
  const periods={daily:'يومي',fiveDays:'كل 5 أيام',weekly:'أسبوعي',tenDays:'كل 10 أيام',monthly:'شهري'};
  const state={view:'home',currentId:null,memberId:null,setupDraft:null};
  let chartInstances=[];
  const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
  const uid=()=>Date.now()+'_'+Math.random().toString(36).slice(2,8);
  const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const formatMoney=n=>new Intl.NumberFormat('ar-YE',{maximumFractionDigits:2}).format(Number(n)||0);
  const dateLabel=d=>new Intl.DateTimeFormat('ar',{dateStyle:'medium'}).format(new Date(d));
  const periodsCount=a=>Math.max(1,Number(a.duration)||Number(a.memberCount)||1);
  function normalize(items){return items.map(a=>({...a,startDate:a.startDate||String(a.createdAt||new Date().toISOString()).slice(0,10),transactions:Array.isArray(a.transactions)?a.transactions:[],members:(a.members||[]).map(m=>({...m,contact:m.contact||'',paid:(Array.isArray(m.paid)?m.paid:Array(periodsCount(a)).fill(0)).map(v=>v===true?Number(a.installment)||0:Number(v)||0),received:!!m.received,recipientPeriod:Number.isInteger(m.recipientPeriod)?m.recipientPeriod:null}))}));}
  const getAssociations=()=>{try{return normalize(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));}catch{return[];}};
  const saveAssociations=items=>{const data=JSON.stringify(items);localStorage.setItem(STORAGE_KEY,data);localStorage.setItem('jamiyati_auto_backup_local',JSON.stringify({app:'جمعيتي',version:3,exportedAt:new Date().toISOString(),associations:items}));};
  const getCurrent=()=>getAssociations().find(a=>a.id===state.currentId);
  const persistCurrent=a=>saveAssociations(getAssociations().map(x=>x.id===a.id?a:x));
  const notify=(msg,type='success')=>{const e=document.createElement('div');e.className=`toast rounded-xl px-4 py-3 text-sm font-bold shadow-lg ${type==='error'?'bg-red-600 text-white':'bg-slate-900 text-white'}`;e.textContent=msg;$('#toastRoot').appendChild(e);setTimeout(()=>e.remove(),3200)};
  const updateTheme=()=>{const dark=localStorage.getItem(THEME_KEY)==='dark';document.documentElement.classList.toggle('dark',dark);$('#themeIcon').textContent=dark?'☀':'☾';};
  const paymentAmount=(a,m,p)=>Number(m.paid?.[p])||0;
  const paidPeriods=(a,m)=>(m.paid||[]).slice(0,periodsCount(a)).filter(v=>Number(v)>=Number(a.installment)&&Number(a.installment)>0).length;
  const partialPeriods=(a,m)=>(m.paid||[]).slice(0,periodsCount(a)).filter(v=>Number(v)>0&&Number(v)<Number(a.installment)).length;
  const unpaidPeriods=(a,m)=>(m.paid||[]).slice(0,periodsCount(a)).reduce((out,v,i)=>{if(Number(v)<Number(a.installment))out.push(i+1);return out},[]);
  const collectedAmount=(a,m)=>(m.paid||[]).slice(0,periodsCount(a)).reduce((n,v)=>n+(Number(v)||0),0);
  function logTransaction(a,type,details={}){a.transactions=Array.isArray(a.transactions)?a.transactions:[];a.transactions.push({id:uid(),date:new Date().toISOString(),type,...details});}
  const transactionLabel=t=>({payment:'سداد قسط',receive:'استلام سهم',edit:'تعديل بيانات',backup:'نسخة احتياطية'}[t]||t);

  function dueDate(a,p){const d=new Date(`${a.startDate||String(a.createdAt).slice(0,10)}T00:00:00`);if(Number.isNaN(d.getTime()))return '';if(a.frequency==='monthly')d.setMonth(d.getMonth()+p);else{const days={daily:1,fiveDays:5,weekly:7,tenDays:10,monthly:30}[a.frequency]||7;d.setDate(d.getDate()+days*p)}return new Intl.DateTimeFormat('ar-YE',{dateStyle:'medium'}).format(d)}

  function render(){updateTheme();$('#backHomeBtn').classList.toggle('hidden',state.view==='home');$('#app').innerHTML=state.view==='home'?homeView():state.view==='setup'?setupView():state.view==='member'?memberView():dashboardView();bindView();}
  function homeView(){const items=getAssociations();return `<section class="mb-8 rounded-3xl bg-gradient-to-br from-teal-800 via-teal-700 to-cyan-700 p-6 text-white shadow-xl sm:p-10"><span class="mb-3 inline-flex rounded-full bg-white/15 px-3 py-1 text-xs font-bold">إدارة بسيطة. متابعة أوضح.</span><h1 class="text-3xl font-extrabold leading-tight sm:text-5xl">كل جمعياتك المالية<br><span class="text-teal-100">في مكان واحد</span></h1><p class="mt-4 max-w-xl text-sm leading-7 text-teal-50">أنشئ جمعية جديدة، أضف المشاركين، وتابع الأقساط والاستلامات دون الحاجة إلى خادم أو حساب.</p><div class="mt-6 flex flex-wrap gap-2"><button id="newAssociationBtn" class="btn bg-white text-teal-800" type="button">＋ إضافة جمعية جديدة</button><button id="exportBackupBtn" class="btn bg-teal-900/40 text-white" type="button">⬇ تصدير نسخة احتياطية</button><button id="importBackupBtn" class="btn bg-white/15 text-white" type="button">⬆ استيراد نسخة احتياطية</button><button id="driveInfoBtn" class="btn bg-white/15 text-white" type="button">☁ Google Drive</button><input id="backupFileInput" type="file" accept="application/json,.json" class="hidden"></div></section><section><div class="mb-4"><h2 class="text-xl font-extrabold">قائمة الجمعيات</h2><p class="text-sm text-slate-500 dark:text-slate-400">${items.length?`${items.length} جمعية محفوظة على هذا الجهاز`:'ابدأ بإنشاء أول جمعية لك'}</p></div>${items.length?`<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${items.map(associationCard).join('')}</div>`:`<div class="soft-shadow rounded-3xl border border-dashed border-slate-300 bg-white p-10 text-center dark:border-slate-700 dark:bg-slate-900"><div class="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-2xl bg-teal-50 text-3xl dark:bg-teal-950">📋</div><h3 class="font-extrabold">لا توجد جمعيات بعد</h3><p class="mt-2 text-sm text-slate-500">أنشئ جمعية جديدة لتظهر هنا وتبدأ المتابعة.</p></div>`}</section>`;}
  function associationCard(a){const received=a.members.filter(m=>m.received).length;return `<article class="soft-shadow rounded-2xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900"><div class="flex items-start justify-between gap-3"><div><span class="mb-2 inline-block rounded-full bg-teal-50 px-2.5 py-1 text-[11px] font-bold text-teal-700 dark:bg-teal-950 dark:text-teal-300">${escapeHtml(periods[a.frequency]||a.frequency)}</span><h3 class="text-lg font-extrabold">${escapeHtml(a.name)}</h3></div><button class="deleteAssociation btn btn-danger !p-2" data-id="${a.id}" type="button">🗑</button></div><div class="mt-5 grid grid-cols-2 gap-3 text-sm"><div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-800"><span class="block text-xs text-slate-500">المشاركون</span><strong>${a.members.length}</strong></div><div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-800"><span class="block text-xs text-slate-500">القسط</span><strong>${formatMoney(a.installment)}</strong></div></div><div class="mt-4"><div class="mb-1 flex justify-between text-xs"><span>التسليم</span><strong>${received}/${a.members.length}</strong></div><div class="h-2 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800"><div class="h-full rounded-full bg-teal-600" style="width:${a.members.length?Math.round(received/a.members.length*100):0}%"></div></div></div><button class="openAssociation btn btn-primary mt-5 w-full" data-id="${a.id}" type="button">دخول إلى الإدارة ←</button></article>`;}
  function setupView(){return `<section class="mx-auto max-w-3xl"><button id="setupBackBtn" class="btn btn-ghost mb-4" type="button">→ العودة للقائمة</button><div class="soft-shadow rounded-3xl border border-slate-200 bg-white p-5 sm:p-8 dark:border-slate-800 dark:bg-slate-900"><div class="mb-7"><span class="text-sm font-bold text-teal-700 dark:text-teal-400">الخطوة 1 من 2</span><h1 class="mt-2 text-2xl font-extrabold">إنشاء جمعية جديدة</h1><p class="mt-1 text-sm text-slate-500">أدخل البيانات الأساسية ثم أضف أسماء المشاركين وجهات الاتصال.</p></div><form id="setupForm" class="space-y-5"><label class="block"><span class="mb-2 block text-sm font-bold">اسم الجمعية</span><input class="field" name="name" required placeholder="مثال: جمعية الأصدقاء"></label><div class="grid gap-5 sm:grid-cols-2"><label class="block"><span class="mb-2 block text-sm font-bold">عدد الأفراد المشاركين</span><input class="field" name="memberCount" type="number" min="2" max="100" value="10" required></label><label class="block"><span class="mb-2 block text-sm font-bold">مبلغ القسط لكل فرد</span><input class="field" name="installment" type="number" min="0" step="0.01" required placeholder="10000"></label><label class="block"><span class="mb-2 block text-sm font-bold">مدة الجمعية (عدد الأسهم)</span><input class="field" name="duration" type="number" min="1" max="120" value="10" required></label><label class="block"><span class="mb-2 block text-sm font-bold">تاريخ بداية الجمعية</span><input class="field" name="startDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label class="block"><span class="mb-2 block text-sm font-bold">فترة سداد الأقساط</span><select class="field" name="frequency"><option value="daily">يومي</option><option value="fiveDays">كل 5 أيام</option><option value="weekly" selected>أسبوعي</option><option value="tenDays">كل 10 أيام</option><option value="monthly">شهري</option></select></label></div><label class="block"><span class="mb-2 block text-sm font-bold">طريقة تحديد المستلم</span><select class="field" name="orderMode"><option value="random">قرعة عشوائية</option><option value="manual">تحديد وترتيب يدوي</option></select></label><button class="btn btn-primary w-full" type="submit">متابعة لإضافة المشاركين ←</button></form></div></section>`;}
  function participantsView(d){const c=Number(d.memberCount);return `<section class="mx-auto max-w-4xl"><div class="soft-shadow rounded-3xl border border-slate-200 bg-white p-5 sm:p-8 dark:border-slate-800 dark:bg-slate-900"><div class="mb-7"><span class="text-sm font-bold text-teal-700 dark:text-teal-400">الخطوة 2 من 2</span><h1 class="mt-2 text-2xl font-extrabold">أسماء المشاركين وجهات الاتصال</h1><p class="mt-1 text-sm text-slate-500">لا يمكن تكرار الاسم داخل نفس الجمعية. يمكنك استخدام زر استرداد جهة اتصال.</p></div><form id="participantsForm"><div class="space-y-3">${Array.from({length:c},(_,i)=>`<div class="grid gap-2 rounded-2xl bg-slate-50 p-3 sm:grid-cols-[auto_1fr_1fr_auto] sm:items-center dark:bg-slate-800"><span class="grid h-9 w-9 place-items-center rounded-xl bg-teal-50 text-sm font-extrabold text-teal-700 dark:bg-teal-950 dark:text-teal-300">${i+1}</span><input class="field participantName" name="member_${i}" required placeholder="اسم المشترك ${i+1}"><input class="field participantContact" name="contact_${i}" placeholder="رقم الهاتف (اختياري)" inputmode="tel"><button class="contactPicker btn btn-secondary !px-3 !py-2 !text-xs" data-index="${i}" type="button">استرداد جهة اتصال</button></div>`).join('')}</div><div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-between"><button id="participantsBackBtn" class="btn btn-secondary" type="button">→ تعديل البيانات</button><button class="btn btn-primary" type="submit">إنشاء الجمعية ✓</button></div></form></div></section>`;}
  function memberView(){
    const a=getCurrent(),m=a?.members.find(x=>x.id===state.memberId);if(!a||!m){state.view='dashboard';return dashboardView()}
    const history=(a.transactions||[]).filter(t=>t.memberId===m.id).sort((x,y)=>new Date(y.date)-new Date(x.date));
    const payments=Array.from({length:periodsCount(a)},(_,p)=>`<tr class="border-t border-slate-100 dark:border-slate-800"><td class="px-3 py-3">السهم ${p+1}</td><td class="px-3 py-3">${dueDate(a,p)}</td><td class="px-3 py-3 font-bold">${formatMoney(paymentAmount(a,m,p))}</td><td class="px-3 py-3">${paymentAmount(a,m,p)>=Number(a.installment)?'مكتمل':paymentAmount(a,m,p)>0?'جزئي':'غير مسدد'}</td></tr>`).join('');
    const events=history.length?history.map(t=>`<tr class="border-t border-slate-100 dark:border-slate-800"><td class="px-3 py-3">${dateLabel(t.date)}</td><td class="px-3 py-3">${transactionLabel(t.type)}</td><td class="px-3 py-3">${t.period!==undefined?`السهم ${t.period+1}`:''}</td><td class="px-3 py-3">${t.amount!==undefined?formatMoney(t.amount):t.type==='receive'?'تم تثبيت الاستلام':'تم تحديث البيانات'}</td></tr>`).join(''):'<tr><td class="px-3 py-4 text-center text-slate-500" colspan="4">لا توجد عمليات مسجلة بعد</td></tr>';
    return `<section><button id="memberBackBtn" class="btn btn-ghost mb-4" type="button">→ العودة للجمعية</button><div class="mb-6 rounded-3xl bg-gradient-to-br from-teal-800 to-cyan-700 p-6 text-white"><div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center"><div><p class="text-sm text-teal-100">السجل المالي للمشترك</p><h1 class="text-3xl font-extrabold">${escapeHtml(m.name)}</h1><p class="mt-2 text-sm text-teal-100">${m.contact||'لا يوجد رقم اتصال'} · ${escapeHtml(a.name)}</p></div><button class="waReminder btn bg-white text-teal-800" data-member="${m.id}" type="button">تذكير واتساب</button></div></div><div class="mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><div class="rounded-2xl bg-white p-4 shadow-sm dark:bg-slate-900"><small class="text-slate-500">المبلغ المدفوع</small><strong class="mt-1 block text-xl">${formatMoney(collectedAmount(a,m))}</strong></div><div class="rounded-2xl bg-white p-4 shadow-sm dark:bg-slate-900"><small class="text-slate-500">أقساط كاملة</small><strong class="mt-1 block text-xl">${paidPeriods(a,m)}</strong></div><div class="rounded-2xl bg-white p-4 shadow-sm dark:bg-slate-900"><small class="text-slate-500">دفعات جزئية</small><strong class="mt-1 block text-xl">${partialPeriods(a,m)}</strong></div><div class="rounded-2xl bg-white p-4 shadow-sm dark:bg-slate-900"><small class="text-slate-500">الاستلام</small><strong class="mt-1 block text-xl">${m.received?`استلم السهم ${m.recipientPeriod!==null?m.recipientPeriod+1:''}`:'لم يستلم'}</strong></div></div><div class="grid gap-6 lg:grid-cols-2"><div class="table-wrap bg-white dark:bg-slate-900"><div class="p-4 font-extrabold">تفاصيل دفعات الأسهم</div><table class="min-w-full text-sm"><thead><tr><th class="px-3 py-3">السهم</th><th class="px-3 py-3">الاستحقاق</th><th class="px-3 py-3">المدفوع</th><th class="px-3 py-3">الحالة</th></tr></thead><tbody>${payments}</tbody></table></div><div class="table-wrap bg-white dark:bg-slate-900"><div class="p-4 font-extrabold">السجل المالي الكامل</div><table class="min-w-full text-sm"><thead><tr><th class="px-3 py-3">التاريخ</th><th class="px-3 py-3">العملية</th><th class="px-3 py-3">السهم</th><th class="px-3 py-3">التفاصيل</th></tr></thead><tbody>${events}</tbody></table></div></div></section>`;
  }

  function renderCharts(){const a=getCurrent();if(!a||typeof Chart==='undefined')return;chartInstances.forEach(c=>c.destroy());chartInstances=[];const labels=Array.from({length:periodsCount(a)},(_,p)=>`السهم ${p+1}`),expected=labels.map(()=>Number(a.installment)*a.members.length),collected=labels.map((_,p)=>a.members.reduce((n,m)=>n+paymentAmount(a,m,p),0)),overdue=expected.map((v,i)=>Math.max(0,v-collected[i]));const common={responsive:true,plugins:{legend:{display:false},title:{display:true,color:document.documentElement.classList.contains('dark')?'#e2e8f0':'#334155',font:{family:'Cairo',size:15}}},scales:{y:{beginAtZero:true}}};chartInstances.push(new Chart($('#paymentChart'),{type:'bar',data:{labels,datasets:[{label:'نسبة السداد',data:collected.map((v,i)=>expected[i]?Math.round(v/expected[i]*100):0),backgroundColor:'#0f766e'}]},options:{...common,plugins:{...common.plugins,title:{...common.plugins.title,text:'نسبة السداد لكل سهم (%)'}},scales:{y:{beginAtZero:true,max:100}}}}));chartInstances.push(new Chart($('#collectionChart'),{type:'line',data:{labels,datasets:[{label:'المحصل',data:collected,borderColor:'#0891b2',backgroundColor:'rgba(8,145,178,.15)',fill:true,tension:.3}]},options:{...common,plugins:{...common.plugins,title:{...common.plugins.title,text:'المبالغ المحصلة'}}}}));chartInstances.push(new Chart($('#overdueChart'),{type:'bar',data:{labels,datasets:[{label:'المتأخر',data:overdue,backgroundColor:'#dc2626'}]},options:{...common,plugins:{...common.plugins,title:{...common.plugins.title,text:'المبالغ المتأخرة'}}}}));}
  function showDriveInfo(){alert('النسخ التلقائي المحلي يعمل داخل هذا الجهاز. لربط Google Drive فعلياً نحتاج Google OAuth Client ID وتفويض الحساب، ولا يجوز وضع بيانات OAuth سرية داخل GitHub Pages العام. عند تزويدي بـ Client ID المخصص للويب أضيف زر التفويض والرفع التلقائي بأمان.');}

  async function shareReport(){const text=reportText();if(navigator.share){try{await navigator.share({title:`تقرير ${getCurrent().name}`,text})}catch(e){}}else{await navigator.clipboard?.writeText(text);notify('المشاركة غير مدعومة، تم نسخ التقرير')}}
  function showManage(){const a=getCurrent();$('#modalRoot').innerHTML=`<div class="modal-bg fixed inset-0 z-50 grid place-items-center p-4"><div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl dark:bg-slate-900"><div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">إعدادات الجمعية</h2><button class="closeModal btn btn-ghost !p-2" type="button">✕</button></div><form id="manageForm" class="mt-5 space-y-4"><label class="block"><span class="mb-2 block text-sm font-bold">اسم الجمعية</span><input class="field" name="name" value="${escapeHtml(a.name)}" required></label><label class="block"><span class="mb-2 block text-sm font-bold">مبلغ القسط</span><input class="field" name="installment" type="number" min="0" value="${a.installment}" required></label><label class="block"><span class="mb-2 block text-sm font-bold">تاريخ بداية الجمعية</span><input class="field" name="startDate" type="date" value="${a.startDate||String(a.createdAt).slice(0,10)}" required></label><button class="btn btn-primary w-full" type="submit">حفظ التعديلات</button></form></div></div>`;$('.closeModal').onclick=closeModal;$('#manageForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));a.name=d.name.trim();a.installment=Number(d.installment)||0;a.startDate=d.startDate||a.startDate;persistCurrent(a);closeModal();render();notify('تم حفظ التعديلات')}}
  const closeModal=()=>$('#modalRoot').innerHTML='';
  document.addEventListener('DOMContentLoaded',()=>{updateTheme();render()});
  </script>
</body></html>
